name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # Rust toolchain used by every job. Change it here to switch versions.
  RUST_VERSION: "1.100.0"

jobs:
  fmt:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install Rust ${{ env.RUST_VERSION }}
      run: |
        rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
        rustup default "$RUST_VERSION"
    - name: Format check
      run: cargo fmt --check

  feature-matrix:
    name: features (${{ matrix.extra-args || 'default' }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        extra-args:
          - ""
          - "--no-default-features"
          - "--no-default-features --features async"
          - "--no-default-features --features time"
          - "--no-default-features --features async,time"

    steps:
    - uses: actions/checkout@v5
    - name: Install Rust ${{ env.RUST_VERSION }}
      run: |
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
        rustup default "$RUST_VERSION"
    - name: Run tests
      run: cargo test ${{ matrix.extra-args }}
    - name: Run clippy
      run: cargo clippy --all-targets ${{ matrix.extra-args }} -- -D warnings
